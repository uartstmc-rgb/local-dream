name: Build APK

on:
  workflow_dispatch:
    inputs:
      separate_app:
        description: "Install side-by-side with the original app (different package name)"
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Fetch native libs from the original APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download base --pattern "*.apk" --output base.apk
          mkdir -p extracted
          unzip -q base.apk "lib/arm64-v8a/libstable_diffusion_core.so" \
                            "lib/arm64-v8a/libdit_engine.so" \
                            "assets/qnnlibs/*" "assets/ditlibs/*" \
                            "assets/licenses/*" -d extracted
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/assets
          cp extracted/lib/arm64-v8a/*.so app/src/main/jniLibs/arm64-v8a/
          cp -r extracted/assets/qnnlibs extracted/assets/ditlibs \
                extracted/assets/licenses app/src/main/assets/
          ls -la app/src/main/jniLibs/arm64-v8a

      - name: Separate package name (optional)
        if: ${{ inputs.separate_app }}
        run: |
          sed -i 's/applicationId = "io.github.xororz.localdream"/applicationId = "io.github.xororz.localdream.mod"/' app/build.gradle.kts
          grep -n applicationId app/build.gradle.kts

      - name: Create signing key
        run: |
          keytool -genkeypair -v -keystore "$PWD/ci.jks" -storepass android123 \
            -keypass android123 -alias key0 -keyalg RSA -keysize 2048 \
            -validity 10000 -dname "CN=LocalDream Mod"

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew assembleBasicRelease --no-daemon \
            -PRELEASE_STORE_FILE="$PWD/ci.jks" \
            -PRELEASE_STORE_PASSWORD=android123 \
            -PRELEASE_KEY_ALIAS=key0 \
            -PRELEASE_KEY_PASSWORD=android123

      - uses: actions/upload-artifact@v4
        with:
          name: LocalDream-mod-apk
          path: app/build/outputs/apk/basic/release/*.apk
